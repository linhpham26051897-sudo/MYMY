<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>MYMY Home</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="header">

        <div class="profile">

            <div class="avatar">
                💜
            </div>

            <div class="user-info">

                <h2 id="welcomeName">
                    MYMY
                </h2>

                <p>🟢 Đang hoạt động</p>

            </div>

        </div>

        <button id="logoutBtn">
            Đăng xuất
        </button>

    </div>

    <div class="home-card">

        <h2>Xin chào 👋</h2>

        <p id="emailShow"></p>

        <input id="roomInput" placeholder="Nhập mã phòng">

        <button id="goChat">
            💬 Vào phòng Chat
        </button>

        <button id="goCall">
            📞 Vào phòng Gọi
        </button>

    </div>

</div>

<script src="home.js"></script>

</body>
</html>
