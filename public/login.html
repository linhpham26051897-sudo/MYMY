<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>MYMY - Đăng nhập</title>

    <link rel="stylesheet" href="auth.css">
</head>

<body>

<div class="auth-card">

    <div class="logo">
        💜
    </div>

    <h1>MYMY</h1>

    <p>Đăng nhập để tiếp tục</p>

    <input
        id="email"
        type="email"
        placeholder="Email"
    >

    <input
        id="password"
        type="password"
        placeholder="Mật khẩu"
    >

    <button id="loginBtn">
        Đăng nhập
    </button>

    <div class="bottom-text">

        Chưa có tài khoản?

        <a href="register.html">
            Đăng ký
        </a>

    </div>

</div>

<script src="login.js"></script>

</body>
</html>
