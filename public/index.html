<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MYMY - Trang chủ</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="logo">
      💜 MYMY
    </div>

    <div class="profile-card">

      <div class="avatar" id="avatarLetter">
        N
      </div>

      <h3 id="fullName">
        Nguyen Van Linh
      </h3>

      <p id="emailUser">
        linh@gmail.com
      </p>

      <span class="status">
        🟢 Đang hoạt động
      </span>

    </div>

    <button id="logoutBtn" class="logout">
      🚪 Đăng xuất
    </button>

    <div class="online-box">

      <h4>👥 Thành viên Online</h4>

      <div id="memberList">

        <div class="member">
          <span class="dot"></span>
          Bạn
        </div>

      </div>

    </div>

  </aside>

  <!-- MAIN -->
  <main class="main">

    <div class="header">

      <input
        id="searchRoom"
        placeholder="🔍 Tìm cuộc trò chuyện..."
      >

      <button id="createRoomBtn">
        ➕ Phòng mới
      </button>

    </div>

    <h2 class="title">
      Cuộc trò chuyện
    </h2>

    <div id="chatList" class="room-list"></div>

  </main>

</div>

<script src="/socket.io/socket.io.js"></script>

<script src="script.js"></script>

</body>
</html>
