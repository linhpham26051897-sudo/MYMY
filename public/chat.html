<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MYMY Chat</title>

  <link rel="stylesheet" href="chat.css"/>
</head>

<body>

<div class="chat-app">

  <!-- HEADER -->
  <header class="chat-header">

    <button id="backBtn" class="icon-btn">
      ⬅
    </button>

    <div class="room-center">

      <div class="room-avatar">💜</div>

      <div class="room-text">
        <h3 id="roomName">Đang tải...</h3>
        <p id="roomStatus">🟢 Đang hoạt động</p>
      </div>

    </div>

    <div class="header-actions">

      <button id="voiceCallBtn"
              class="icon-btn"
              title="Gọi thoại">
        📞
      </button>

      <button id="videoCallBtn"
              class="icon-btn"
              title="Video Call">
        📹
      </button>

    </div>

  </header>

  <!-- DANH SÁCH THÀNH VIÊN -->
  <section class="members-bar">

    <div class="members-title">
      👥 Thành viên Online
    </div>

    <div id="memberList" class="member-list"></div>

  </section>

  <!-- KHUNG CHAT -->
  <main class="messages-wrapper">

    <div id="typingBox" class="typing-box"></div>

    <div id="messages" class="messages"></div>

  </main>

  <!-- GỬI TIN -->
 <!-- GỬI TIN -->
<footer class="send-bar">

    <div id="typingBox" class="typing-box"></div>

    <div class="chat-input">

        <button id="emojiBtn" class="icon-btn">😊</button>

        <label for="imageInput" class="icon-btn">📎</label>
        <input id="imageInput" type="file" hidden accept="image/*,.pdf,.doc,.docx">

        <input
            id="messageInput"
            type="text"
            placeholder="Nhập tin nhắn..."
            autocomplete="off"
        >

        <button id="sendBtn" class="send-btn">➤</button>

    </div>

</footer>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="chat.js"></script>

</body>
</html>
