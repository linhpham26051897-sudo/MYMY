<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MYMY Chat</title>

  <link rel="stylesheet" href="chat.css">
</head>

<body>

<div class="chat-app">

  <!-- Header -->
  <header class="chat-header">

    <button id="backBtn">⬅</button>

    <div class="user">

      <div class="avatar" id="roomAvatar">💜</div>

      <div>
        <h3 id="roomName">Đang tải...</h3>
        <p>🟢 Đang hoạt động</p>
      </div>

    </div>

   <button id="callBtn" class="call-button">
    📞
</button>

  </header>

 <!-- ================= KHU VỰC TIN NHẮN ================= -->
<main class="messages-wrapper">

    <!-- Hiển thị "đang nhập..." -->
    <div id="typingBox" class="typing-box"></div>

    <!-- Danh sách tin nhắn -->
    <div id="messages" class="messages"></div>

</main>

<!-- ================= THANH NHẬP TIN NHẮN ================= -->
<footer class="send-bar">

    <button id="emojiBtn">😊</button>

    <input
        id="messageInput"
        type="text"
        placeholder="Nhập tin nhắn..."
    >

    <button id="sendBtn">➤</button>

</footer>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="chat.js"></script>

</body>
</html>
