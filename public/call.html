<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MYMY Call</title>

  <link rel="stylesheet" href="call.css">
</head>
<body>

<div class="call-page">

  <!-- VIDEO NGƯỜI KIA -->
  <div id="remoteVideoContainer" class="remote-video-container">

    <div class="waiting-text" id="waitingText">
      📡 Đang chờ người kia tham gia...
    </div>

  </div>

  <!-- CAMERA CỦA MÌNH -->
  <video
    id="localVideo"
    autoplay
    muted
    playsinline
    class="local-video">
  </video>

  <!-- HEADER -->
  <header class="call-header">

    <button id="backBtn" class="header-btn">⬅</button>

    <div class="call-info">

      <h2 id="roomTitle">MYMY</h2>

      <p id="callStatus">Đang kết nối...</p>

    </div>

  </header>

  <!-- ĐỒNG HỒ -->
  <div id="callTimer" class="timer">
    00:00
  </div>

  <!-- THANH ĐIỀU KHIỂN -->
  <div class="controls">

    <button id="micBtn" class="control-btn">
      🎤
    </button>

    <button id="cameraBtn" class="control-btn">
      📹
    </button>

    <button id="switchCameraBtn" class="control-btn">
      🔄
    </button>

    <button id="speakerBtn" class="control-btn">
      🔊
    </button>

    <button id="hangupBtn" class="control-btn end-call">
      📞
    </button>

  </div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

<script type="module" src="call.js"></script>

</body>
</html>
