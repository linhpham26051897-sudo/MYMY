<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MYMY Video Call</title>

<link rel="stylesheet" href="call.css">

</head>

<body>

<div class="call-page">

    <!-- Video người kia -->
    <div id="remoteVideo" class="remote-video"></div>

    <!-- Camera mình -->
    <video
        id="localVideo"
        autoplay
        playsinline
        muted
        class="local-video">
    </video>

    <!-- Header -->
    <div class="call-header">

        <button id="backBtn">⬅</button>

        <div>

            <h2 id="roomName"></h2>

            <p id="callStatus">
                📡 Đang kết nối...
            </p>

        </div>

    </div>

    <!-- Đồng hồ -->
    <div id="timer" class="timer">
        00:00
    </div>

    <!-- Thanh điều khiển -->
    <div class="controls">

        <button id="micBtn">🎤</button>

        <button id="cameraBtn">📹</button>

        <button id="switchCameraBtn">🔄</button>

        <button id="speakerBtn">🔊</button>

        <button id="hangupBtn" class="red">📞</button>

    </div>

</div>

<script src="/socket.io/socket.io.js"></script>


<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

<script src="call.js"></script>

</body>

</html>
