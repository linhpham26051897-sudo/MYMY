<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>MYMY - Đăng ký</title>

    <link rel="stylesheet" href="auth.css">
</head>

<body>

<div class="auth-card">

    <div class="logo">
        💜
    </div>

    <h1>Tạo tài khoản MYMY</h1>

    <p>Đăng ký để bắt đầu trò chuyện</p>

    <input id="fullname" placeholder="Họ và tên">

    <input id="username" placeholder="Tên người dùng">

    <input id="email" type="email" placeholder="Email">

    <input id="password" type="password" placeholder="Mật khẩu">

    <input id="confirmPassword" type="password" placeholder="Nhập lại mật khẩu">

    <button id="registerBtn">
        Tạo tài khoản
    </button>

    <div class="bottom-text">
        Đã có tài khoản?

        <a href="login.html">
            Đăng nhập
        </a>
    </div>

</div>

<script src="register.js"></script>

</body>
</html>
